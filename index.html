<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>million-world</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="million-world" />
    <meta name="theme-color" content="#0b0d1a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- タッチ層: ゲームロジックはこの DOM を知らない。src/input/touch.ts だけが触る -->
    <div id="touch-layer" aria-hidden="true">
      <div id="stick-zone">
        <div id="stick-base"><div id="stick-knob"></div></div>
      </div>
      <div id="cam-zone"></div>
      <div id="btn-lock" class="tbtn tbtn-small"><span>LOCK</span></div>
      <div id="btn-dodge" class="tbtn tbtn-mid"><span>回避</span></div>
      <!-- ジャンプ（M7-2。回避の上。置き場所は実機で決める: src/style.css の .tbtn-jump の right / bottom だけを触る） -->
      <div id="btn-jump" class="tbtn tbtn-jump"><span>跳ぶ</span></div>
      <div id="btn-attack" class="tbtn tbtn-big"><span>攻撃</span></div>
      <div id="btn-guard" class="tbtn tbtn-guard"><span>ガード</span></div>
      <!-- アイテム欄（タップで使う・長押しか上へ払うと一覧）。中身は src/input/slot-button.ts が作る。スキル欄も同じ部品で並べる予定 -->
      <div id="btn-item" class="tbtn tbtn-item"></div>
      <!-- スキル欄（剣技。アイテム欄と同じ部品。タップで使う・長押しか上へ払うと一覧）。ADR-031 -->
      <div id="btn-skill" class="tbtn tbtn-skill"></div>
      <!-- 杖の魔法（ADR-048）: 全部を並列のボタンで並べる（杖を構えているあいだだけ出る）。中身は src/input/spell-buttons.ts が作る。置き場所は src/style.css の #spell-grid -->
      <div id="spell-grid"></div>
      <!-- 装備の切替（次の装備へ）。ラベルは今の装備名（src/input/touch.ts の setEquipLabel） -->
      <div id="btn-equip" class="tbtn tbtn-equip"><span>装備</span></div>
    </div>

    <div id="hud">
      <div id="fx-layer"></div>
      <div id="hurt-flash"></div>
      <!-- ミスティカルドッジ（ADR-030）: 発動中の画面の縁の色と、残り時間・再使用のゲージ。値は src/ui/hud.ts の setMystical -->
      <div id="mystical-fx"></div>
      <div id="mystical-gauge" data-state="ready"><div class="mystical-fill"></div></div>
      <div id="hp-player" class="hp"><div class="hp-lag"></div><div class="hp-fill"></div></div>
      <!-- レベルと経験値（HP バーの左。ADR-033）。値は src/ui/hud.ts の setGrowth -->
      <div id="lv-box"><span class="lv-num">Lv 1</span><div class="lv-bar"><div class="lv-fill"></div></div><span class="tier-badge" data-tier="1"></span><span class="buff-badge"><span class="buff-text"></span><span class="buff-bar"><span class="buff-fill"></span></span></span><span class="buff-badge regen-badge"><span class="buff-text">再生</span><span class="buff-bar"><span class="buff-fill"></span></span></span></div>
      <div id="hp-boss" class="hp" style="display: none"><div class="hp-lag"></div><div class="hp-fill"></div><div class="poise"><div class="poise-fill"></div></div><span class="hp-name"></span></div>
      <div id="hp-target" class="hp" style="display: none"><div class="hp-lag"></div><div class="hp-fill"></div><div class="poise"><div class="poise-fill"></div></div><span class="hp-name"></span></div>
      <div id="debug"></div>
      <!-- 操作ガイド（攻撃ボタンとスティックの向きで何が出るか）。中身は src/ui/move-guide.ts が作る -->
      <div id="move-guide" data-mode="hidden"></div>
      <!-- メニュー（一時停止。ステータス・スキル・技表・設定）を開くボタン（装備の切替の下）。未使用のポイントがあると金の点が付く（src/ui/pause-menu.ts） -->
      <button id="btn-menu" type="button">メニュー</button>
    </div>

    <!-- 一時停止メニュー（ADR-033）。開いているあいだは戦闘を止める。タブ（ステータス・スキル・技表・設定）の中身は src/ui/menu/*.ts が作る。機能が増えたらタブを足す -->
    <div id="menu-overlay" class="hidden">
      <div class="menu-card">
        <div class="menu-head"><span class="menu-title">メニュー</span><button class="menu-close" type="button">閉じる</button></div>
        <div class="menu-tabs"></div>
        <div class="menu-body" data-scroll></div>
      </div>
    </div>

    <div id="banner"><span></span></div>

    <!-- リザルト（勝ち・負け）。「もう一度」で最初から -->
    <div id="result" class="hidden">
      <div class="result-card">
        <div class="result-title"></div>
        <!-- 挑んだ敵の段階と、勝って次の段階が解放されたときのお知らせ（ADR-036）。src/ui/hud.ts の showResult が書く -->
        <div class="result-tier" data-tier="1"></div>
        <div class="result-rank"><span></span></div>
        <div class="result-rows">
          <div><dt>撃破</dt><dd id="r-kills"></dd></div>
          <div><dt>経験値</dt><dd id="r-xp"></dd></div>
          <div><dt>タイム</dt><dd id="r-time"></dd></div>
          <div><dt>被ダメージ</dt><dd id="r-damage"></dd></div>
          <div><dt>被弾</dt><dd id="r-hits"></dd></div>
          <div><dt>パリィ</dt><dd id="r-parries"></dd></div>
        </div>
        <div class="result-unlock hidden"></div>
        <div class="result-buttons">
          <button id="result-retry" type="button">もう一度</button>
          <button id="result-next" type="button" class="hidden">次の段階へ</button>
        </div>
      </div>
    </div>

    <div id="start-overlay">
      <div class="title">
        <div class="title-main">MILLION WORLD</div>
        <div class="title-sub">prototype M0</div>
      </div>
      <!-- 装備の選択。src/ui/hud.ts の setupLoadoutPicker が中身を作る -->
      <div id="loadout-pick"></div>
      <!-- 敵の段階（色違いの強化版）の選択。解放済みの段階だけ選べる。src/ui/hud.ts の setupTierPicker が中身を作る（ADR-036） -->
      <div id="tier-pick"></div>
      <div class="start-hint">タップして開始</div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
