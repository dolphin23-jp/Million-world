<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>GLB inspector</title>
    <style>
      html, body { margin: 0; background: #e9ecf5; }
      canvas { display: block; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

      const W = 640, H = 800;
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(W, H);
      renderer.setPixelRatio(1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe9ecf5);
      scene.add(new THREE.HemisphereLight(0xffffff, 0xb8bdd0, 2.0));
      const dir = new THREE.DirectionalLight(0xffffff, 1.4);
      dir.position.set(2, 4, 3);
      scene.add(dir);
      const camera = new THREE.PerspectiveCamera(30, W / H, 0.01, 100);

      let model = null;
      let mixer = null;
      let clips = [];
      let box = new THREE.Box3();

      window.loadModel = async (url) => {
        const loader = new GLTFLoader();
        loader.setMeshoptDecoder(MeshoptDecoder);
        const gltf = await loader.loadAsync(url);
        model = gltf.scene;
        scene.add(model);
        clips = gltf.animations;
        if (clips.length) mixer = new THREE.AnimationMixer(model);
        window.__model = model; window.__mixer = mixer; window.__THREE = THREE;
        box.setFromObject(model);
        const stats = { tris: 0, meshes: 0, skinned: 0, bones: 0, textures: [], animations: gltf.animations.map(a => `${a.name}:${a.duration.toFixed(2)}s`) };
        const seenTex = new Set();
        const boneNames = new Set();
        model.traverse((o) => {
          if (o.isMesh) {
            stats.meshes++;
            const g = o.geometry;
            stats.tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
            if (o.isSkinnedMesh) { stats.skinned++; o.skeleton.bones.forEach(b => boneNames.add(b.name)); }
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            for (const m of mats) for (const k of ['map', 'normalMap', 'metalnessMap', 'roughnessMap', 'emissiveMap', 'aoMap']) {
              const t = m[k];
              if (t && !seenTex.has(t.uuid)) { seenTex.add(t.uuid); const im = t.image; stats.textures.push(`${k}:${im?.width}x${im?.height}`); }
            }
          }
        });
        stats.bones = boneNames.size;
        stats.boneNames = [...boneNames].slice(0, 80);
        const size = box.getSize(new THREE.Vector3());
        stats.size = [size.x, size.y, size.z].map(v => +v.toFixed(3));
        stats.min = box.min.toArray().map(v => +v.toFixed(3));
        return stats;
      };

      // アニメ: clip index と 0..1 の正規化時間でポーズを固定する。bbox は静止ポーズ(t=0)で固定のまま
      window.setAnim = (index, t01) => {
        if (!mixer || !clips[index]) return false;
        mixer.stopAllAction();
        const action = mixer.clipAction(clips[index]);
        action.play();
        mixer.setTime(clips[index].duration * t01);
        model.updateMatrixWorld(true);
        return true;
      };

      // view: yaw(度, 0=+Z正面から), pitch(度), focus: 'full' | 'head' | 'upper' | 'hands'
      window.setView = (yawDeg, focus = 'full', pitchDeg = 6) => {
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const h = size.y;
        let target = center.clone();
        let dist;
        if (focus === 'head') { target.y = box.min.y + h * 0.9; dist = h * 0.55; }
        else if (focus === 'upper') { target.y = box.min.y + h * 0.7; dist = h * 1.0; }
        else { dist = h * 2.05; }
        const yaw = THREE.MathUtils.degToRad(yawDeg);
        const pitch = THREE.MathUtils.degToRad(pitchDeg);
        camera.position.set(
          target.x + Math.sin(yaw) * Math.cos(pitch) * dist,
          target.y + Math.sin(pitch) * dist,
          target.z + Math.cos(yaw) * Math.cos(pitch) * dist,
        );
        camera.lookAt(target);
        renderer.render(scene, camera);
      };
      // 固定カメラ（bbox に依存しない比較用）。target は足元原点・身長 1.7m 前提
      window.setFixedView = (yawDeg, pitchDeg = 8, dist = 3.6, targetY = 0.9) => {
        const yaw = THREE.MathUtils.degToRad(yawDeg), pitch = THREE.MathUtils.degToRad(pitchDeg);
        camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, targetY + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
        camera.lookAt(0, targetY, 0);
        renderer.render(scene, camera);
      };
      // スキン変形の伸び率を three.js 自身のスキニング（applyBoneTransform）で測る
      window.measureStress = (clipIndex, step = 0.05, thresh = 1.8) => {
        const clip = clips[clipIndex];
        if (!clip || !mixer) return null;
        const meshes = []; model.traverse((o) => { if (o.isSkinnedMesh) meshes.push(o); });
        const results = [];
        for (const mesh of meshes) {
          const geo = mesh.geometry; const posAttr = geo.attributes.position; const nV = posAttr.count;
          const index = geo.index ? geo.index.array : null; const nTri = index ? index.length / 3 : nV / 3;
          const edgeKeys = new Set(); const edges = [];
          const add = (a, b) => { const k = a < b ? a * nV + b : b * nV + a; if (edgeKeys.has(k)) return; edgeKeys.add(k); edges.push(a, b); };
          for (let t = 0; t < nTri; t++) { const a = index ? index[t*3] : t*3, b = index ? index[t*3+1] : t*3+1, c = index ? index[t*3+2] : t*3+2; add(a,b); add(b,c); add(c,a); }
          const nE = edges.length / 2;
          const bind = new Float32Array(nE);
          const pa = new THREE.Vector3(), pb = new THREE.Vector3();
          for (let e = 0; e < nE; e++) { pa.fromBufferAttribute(posAttr, edges[e*2]); pb.fromBufferAttribute(posAttr, edges[e*2+1]); bind[e] = pa.distanceTo(pb); }
          let nanCount = 0, degenerate = 0; for (let e = 0; e < nE; e++) if (bind[e] < 2e-3) degenerate++;
          const skinned = new Float32Array(nV * 3);
          const v = new THREE.Vector3();
          let max = 0, maxT = 0, maxEdge = -1, over = 0, total = 0; const all = []; let minY = Infinity, minYT = 0; const wp = new THREE.Vector3();
          mixer.stopAllAction(); const action = mixer.clipAction(clip); action.play();
          for (let t = 0; t <= clip.duration + 1e-6; t += step) {
            mixer.setTime(Math.min(t, clip.duration)); model.updateMatrixWorld(true); mesh.skeleton.update();
            for (const b of mesh.skeleton.bones) { b.getWorldPosition(wp); if (wp.y < minY) { minY = wp.y; minYT = t; } }
            // applyBoneTransform はメッシュローカル（bindMatrixInverse 適用後）を返すので、world へ戻して bind 座標（=world と同スケール）と比べる
            for (let i = 0; i < nV; i++) { v.fromBufferAttribute(posAttr, i); mesh.applyBoneTransform(i, v); v.applyMatrix4(mesh.matrixWorld); skinned[i*3] = v.x; skinned[i*3+1] = v.y; skinned[i*3+2] = v.z; }
            for (let e = 0; e < nE; e++) {
              const a = edges[e*2], b = edges[e*2+1];
              const L = Math.hypot(skinned[a*3]-skinned[b*3], skinned[a*3+1]-skinned[b*3+1], skinned[a*3+2]-skinned[b*3+2]);
              if (bind[e] < 2e-3) continue; const r = L / bind[e]; if (!Number.isFinite(r)) { nanCount++; continue; } all.push(r); total++; if (r > thresh) over++; if (r > max) { max = r; maxT = t; maxEdge = e; }
            }
          }
          all.sort((x, y) => x - y);
          const p999 = all[Math.floor(all.length * 0.999)], p99 = all[Math.floor(all.length * 0.99)], median = all[Math.floor(all.length * 0.5)];
          let bones = [];
          if (maxEdge >= 0) {
            const si = geo.attributes.skinIndex, sw = geo.attributes.skinWeight; const contrib = new Map();
            for (const vi of [edges[maxEdge*2], edges[maxEdge*2+1]]) for (let k = 0; k < 4; k++) { const w = sw.getComponent(vi, k); if (w > 0.05) { const name = mesh.skeleton.bones[si.getComponent(vi, k)].name; contrib.set(name, (contrib.get(name) ?? 0) + w); } }
            bones = [...contrib.entries()].sort((x, y) => y[1] - x[1]).slice(0, 3).map(([n, w]) => `${n}:${w.toFixed(2)}`);
          }
          results.push({ mesh: mesh.name, nanCount, degenerate, median: +median.toFixed(3), minJointY: +minY.toFixed(3), minJointYAt: +minYT.toFixed(2), clip: clip.name, duration: +clip.duration.toFixed(2), max: +max.toFixed(2), maxAt: +maxT.toFixed(2), p999: +p999.toFixed(2), p99: +p99.toFixed(2), overPct: +((over/total)*100).toFixed(3), worstBones: bones, verdict: max < 2.0 && p999 < 1.6 ? 'OK' : max < 3.0 ? 'WARN' : 'BAD' });
        }
        return results;
      };
      window.__ready = true;
    </script>
  </body>
</html>
